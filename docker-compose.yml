services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # pin to a tested version once chosen
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_PORT=5678
      - N8N_PROXY_HOPS=1
      - N8N_WEBHOOK_URL=${WEBHOOK_URL}   # WEBHOOK_URL alone is deprecated in recent n8n
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./knowledge:/data/knowledge   # writable: the admin dashboard edits shop.md
      - ./prompts:/data/prompts:ro
      - ./workflows:/data/workflows:ro
    expose:
      - "5678"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_HOST=${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - n8n
